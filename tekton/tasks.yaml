apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm
spec:
  workspaces:
    - name: source
  steps:
    - name: install-dependencies
      image: node:22-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npm ci
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: unit-tests
      image: node:22-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npx --no-install jasmine
