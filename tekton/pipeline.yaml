apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline
spec:
  description: Install dependencies, run Jasmine tests, and build/push the Tax Calculator image.
  params:
    - name: image
      type: string
      description: Full container registry image reference (for example, us.icr.io/namespace/tax-calculator:v2)
  workspaces:
    - name: shared-data
      description: Workspace already populated with the application source and package-lock.json
  tasks:
    - name: npminstall
      taskRef:
        name: npm
      workspaces:
        - name: source
          workspace: shared-data
    - name: tests
      runAfter:
        - npminstall
      taskRef:
        name: jasmine
      workspaces:
        - name: source
          workspace: shared-data
    - name: build
      runAfter:
        - tests
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.image)
      workspaces:
        - name: source
          workspace: shared-data
